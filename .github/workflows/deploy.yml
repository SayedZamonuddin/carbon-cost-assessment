name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shards-dashboard-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shards-dashboard-react/package-lock.json

      - run: npm ci

      # The model is validated against the source workbook; never publish a build
      # whose numbers no longer match it.
      - run: npm test -- --watchAll=false
        env:
          CI: true

      - run: npm run build
        env:
          CI: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: shards-dashboard-react/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
